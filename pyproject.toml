[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iceclaw"
version = "0.0.1"
description = "Lunar ice-prospectivity audit workbench (prospectivity index, not detected ice)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0",
  "rasterio>=1.4",
  "agent-framework-core==1.24.0",
  "agent-framework-openai==1.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
prepare = [
  "huggingface_hub>=1.0",  # scripts/prepare_sombench.py only
]

[project.scripts]
iceclaw = "iceclaw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: real OpenAI API test; opt-in via ICECLAW_RUN_LIVE_TESTS=1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# long assertion/prompt lines are fine in tests; src/ stays at 100 columns
"tests/*" = ["E501"]
